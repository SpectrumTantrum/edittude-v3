[project]
name = "edittude-v3"
version = "0.1.0"
description = "edittude-v3 agent harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.15",
    "langchain-deepseek>=1.1.0",
    "python-dotenv>=1.2.3",
    "python-xli[markdown]>=0.2.0",
]

[project.scripts]
edittude-v3 = "edittude_v3.cli:main"
edittude-media = "edittude_v3.media.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edittude_v3"]
